[package]
name             = "continuity-text"
version          = "0.2.29"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
description            = "Text coordinates, selections, and edit primitives for the Continuity editor engine"
documentation          = "https://docs.rs/continuity-text"
keywords               = ["editor", "text", "selection", "rope"]
categories             = ["text-editors", "data-structures"]
readme                 = "README.md"
include                = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md"]
publish                = true

[dependencies]
ropey                = { workspace = true }
unicode-bidi         = { workspace = true }
serde                = { workspace = true }
thiserror            = { workspace = true }
