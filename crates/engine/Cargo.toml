[package]
name = "continuity-engine"
version = "0.2.41"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The editor engine from the Continuity notes app, as a Rust library that leaves saving to your program"
documentation = "https://docs.rs/continuity-engine"
keywords = ["editor", "markdown", "text", "embedding"]
categories = ["text-editors"]
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md"]
publish = true

[dependencies]
continuity-text = { workspace = true }
continuity-buffer = { workspace = true }
ropey = { workspace = true }
ahash = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
continuity-test-fixtures = { workspace = true }
criterion = { workspace = true }
