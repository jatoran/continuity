name: sdk release

on:
  workflow_dispatch:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  performance:
    name: packed browser performance preflight
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install browser test display
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-release-performance-linux
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Gate the exact npm artifact and browser surface
        run: cargo xtask browser-check

  stage:
    name: build immutable SDK bundle
    needs: performance
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-release-windows

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Build, test, audit, and stage once
        run: cargo xtask sdk-release-dry-run

      - name: Resolve bundle
        id: bundle
        shell: pwsh
        run: |
          $directory = Get-Content target/sdk-release/latest-output.txt
          "directory=$directory" >> $env:GITHUB_OUTPUT
          $sbom = Get-ChildItem -LiteralPath $directory -Filter *.cdx.json | Select-Object -First 1
          "sbom=$($sbom.FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify staged hashes
        run: cargo xtask sdk-release-verify "${{ steps.bundle.outputs.directory }}"

      - name: Attest bundle provenance
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: actions/attest@v4
        with:
          subject-path: "${{ steps.bundle.outputs.directory }}/*"

      - name: Attest bundle SBOM
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: actions/attest@v4
        with:
          subject-path: "${{ steps.bundle.outputs.directory }}/*"
          sbom-path: "${{ steps.bundle.outputs.sbom }}"

      - name: Upload immutable bundle
        uses: actions/upload-artifact@v4
        with:
          name: continuity-sdk-bundle
          path: "${{ steps.bundle.outputs.directory }}/*"
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: publish npm package
    needs: stage
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: continuity-sdk-bundle
          path: sdk-bundle
      - run: cargo xtask sdk-release-verify sdk-bundle
      - name: Publish exact tarball to the channel's dist-tag
        # The `./` prefix is load-bearing. npm parses a bare `dir/name.tgz` as a
        # GitHub `owner/repo` shorthand and resolves it over SSH — sdk-v0.2.34
        # died on `git ls-remote ssh://git@github.com/sdk-bundle/...tgz.git`.
        # Only a leading `./` forces the file spec.
        #
        # The dist-tag comes out of the staged manifest, the same way the
        # GitHub release job reads `channel` from it. This step used to
        # hardcode `--tag next`, which meant `sdk/release.toml`'s `stable-tag`
        # was declared and never read: flipping `channel` to `stable` would
        # have promoted the GitHub release while still publishing to `next`,
        # leaving `latest` pinned wherever a by-hand publish last left it.
        run: |
          set -euo pipefail
          dist_tag="$(jq -r '.npmTag' sdk-bundle/release-manifest.json)"
          test -n "$dist_tag" && test "$dist_tag" != null
          echo "publishing to dist-tag $dist_tag"
          npm publish "./sdk-bundle/continuity-editor-${GITHUB_REF_NAME#sdk-v}.tgz" \
            --access public --tag "$dist_tag"

  publish-crates:
    name: publish Cargo closure
    needs: stage
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    # Must match `stage`'s platform. This job re-runs `cargo package` and
    # requires the result to be byte-identical to the staged, hashed, attested
    # `.crate`, which `stage` built on Windows. `cargo package` archives
    # working-tree bytes, and the repository normalizes line endings for exactly
    # one file (`.gitattributes` pins `tutorial.md` to LF), so a Windows
    # checkout carries CRLF where a Linux checkout carries LF. Packaging the
    # same commit on Ubuntu therefore produces a different archive and the
    # comparison below can never pass. That went unnoticed until sdk-v0.2.37
    # because every earlier run failed at trusted-publisher auth first.
    runs-on: windows-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: continuity-sdk-bundle
          path: sdk-bundle
      - run: cargo xtask sdk-release-verify sdk-bundle
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Delegated to xtask on purpose. This step used to inline its own
      # `cargo package` / `cargo publish` loop, which drifted from the flags
      # `cargo xtask sdk-check` stages with: it omitted the
      # `--config patch.crates-io.*` overrides, so the archive it re-derived
      # embedded a `Cargo.lock` resolving `continuity-text` and
      # `continuity-test-support` from the registry rather than from local
      # paths. The staged-hash comparison could then never pass for
      # `continuity-buffer` or `continuity-engine`, and sdk-v0.2.38 published a
      # third of its closure before failing. `xtask/src/sdk_crate_flags.rs` is
      # now the only description of these flags.
      - name: Publish in dependency order and compare Cargo's uploaded archives
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask sdk-publish-crates sdk-bundle

  # There is deliberately no PyPI publication job. The wheel is built only for
  # `cp310-abi3-win_amd64` and there is no source distribution, so publishing it
  # would make `pip install continuity-editor` fail on Linux and macOS with a
  # confusing resolver error — see `EMBEDDING.md`. The wheel is still staged,
  # hashed, attested, and attached to the GitHub Release, so a Windows host can
  # install it from there.
  #
  # It previously existed as a `publish-pypi` job that `github-release` depended
  # on, which gated every SDK release on a publication the project had decided
  # not to make: the job failed `invalid-publisher` on every run and skipped the
  # release job behind it. Restore it only together with cross-platform wheels
  # or an sdist, and register the PyPI trusted publisher before doing so.

  github-release:
    name: publish SDK release assets
    needs: [stage, publish-npm, publish-crates]
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: continuity-sdk-bundle
          path: sdk-bundle
      - name: Create the separate SDK GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel="$(jq -r '.channel' sdk-bundle/release-manifest.json)"
          # A preview SDK must not claim the repository's "Latest" badge; that
          # belongs to the native desktop application. Gate on the staged
          # manifest so the flag follows `sdk/release.toml`'s channel.
          prerelease=""
          case "$channel" in
            preview) prerelease="--prerelease" ;;
            stable) ;;
            *) echo "unexpected SDK channel: $channel" >&2; exit 1 ;;
          esac
          # Both trains tag into one repository, so `--generate-notes` alone
          # picks whichever tag is chronologically previous — which is often a
          # desktop `v*` tag, producing a meaningless cross-train diff. Anchor
          # the range to the previous `sdk-v*` tag instead.
          previous="$(git tag --list 'sdk-v*' --sort=-creatordate \
            | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)"
          notes_range=""
          if [ -n "$previous" ]; then
            notes_range="--notes-start-tag $previous"
          fi
          gh release create "$GITHUB_REF_NAME" sdk-bundle/* \
            --verify-tag \
            --generate-notes \
            --title "Continuity SDK $GITHUB_REF_NAME" \
            ${notes_range} \
            ${prerelease}
