[sdk]
version = "0.2.28"
channel = "preview"
msrv = "1.89"
tag-prefix = "sdk-v"
repository = "https://github.com/jatoran/continuity"

[cargo]
packages = ["continuity-text", "continuity-buffer", "continuity-engine"]

[npm]
package = "@continuity-editor/editor"
