<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
    <title>Continuity Web</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="application-shell">
      <header class="toolbar">
        <div>
          <span class="product">Continuity Web</span>
          <span id="document-name" class="document-name">Host-managed note</span>
        </div>
        <nav aria-label="Document actions">
          <button id="new" type="button">New</button>
          <button id="open" type="button">Open</button>
          <button id="save" type="button">Export</button>
        </nav>
      </header>
      <section id="banner" class="banner" aria-live="assertive" hidden>
        <span id="banner-text"></span>
        <span id="banner-actions" class="banner-actions"></span>
      </section>
      <main id="editor-host"></main>
      <footer>
        <output id="status" role="status" aria-live="polite">Starting Continuity…</output>
      </footer>
    </div>
    <script type="module" src="./renderer.mjs"></script>
  </body>
</html>
