[package]
name = "continuity-python"
version = "0.2.41"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python module for the Continuity editor engine, without a UI"
publish = false

[lib]
name = "_continuity_editor"
crate-type = ["cdylib", "rlib"]

[dependencies]
continuity-buffer = { workspace = true }
continuity-engine = { workspace = true }
continuity-text = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py310"] }
